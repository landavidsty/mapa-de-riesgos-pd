name: Sincronizar Mapa de Riesgos CDMX

on:
  schedule:
    # cada 6 horas — ajusta la frecuencia si quieres (formato cron estándar)
    - cron: "0 */6 * * *"
  workflow_dispatch: {}   # botón para correrlo manual desde la pestaña "Actions" en GitHub

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install pyshp shapely pyproj

      - name: Descargar KML y regenerar las 4 capas de incidentes
        run: python scripts/kml_to_shapefiles.py .

      - name: Commitear si hubo cambios
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add "public/shapefiles/Ni una menos"
          git diff --cached --quiet || git commit -m "Sync mapa de riesgos ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push
